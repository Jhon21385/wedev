<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090B" />
    <meta
      name="description"
      content="Creator OS — your entire creator operation, under one roof. A command center for YouTube, Instagram and LinkedIn."
    />
    <title>Creator OS</title>
    <style>
      html { background: #09090b; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #boot .ring {
        width: 34px; height: 34px; border-radius: 50%;
        border: 1.5px solid rgba(255,255,255,.08);
        border-top-color: #7CB4FF;
        animation: bootspin .85s cubic-bezier(.55,.15,.35,.95) infinite;
      }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ring { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="ring"></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
